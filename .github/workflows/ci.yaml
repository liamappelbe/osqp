name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Verify generated bindings
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
        if: matrix.os == 'ubuntu'

      - name: Export ANDROID_NDK_HOME
        if: matrix.os == 'ubuntu'
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install native toolchains
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

      - run: dart pub get

      - name: Run tests (local CMake build)
        shell: bash
        run: |
          dart test
          grep "^osqp:" .dart_tool/hooks_runner/osqp/*/stdout.txt

      # Keep this list consistent with lib/src/hook_helpers/targets.dart
      - name: Build Linux & Android targets
        if: matrix.os == 'ubuntu'
        run: |
          dart tool/build.dart -oandroid -aarm64
          dart tool/build.dart -oandroid -ax64
          dart tool/build.dart -olinux -aarm64
          dart tool/build.dart -olinux -ariscv64
          dart tool/build.dart -olinux -ax64

      - name: Build macOS & iOS targets
        if: matrix.os == 'macos'
        run: |
          dart tool/build.dart -omacos -aarm64
          dart tool/build.dart -omacos -ax64
          dart tool/build.dart -oios -iiphoneos -aarm64
          dart tool/build.dart -oios -iiphonesimulator -aarm64
          dart tool/build.dart -oios -iiphonesimulator -ax64

      - name: Build Windows targets
        if: matrix.os == 'windows'
        run: |
          dart tool/build.dart -owindows -aarm64
          dart tool/build.dart -owindows -ax64

      - name: Upload prebuilt assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-prebuilt-assets
          path: |
            prebuilt/*.dll
            prebuilt/*.dylib
            prebuilt/*.so
          if-no-files-found: error

      - name: Run tests (prebuilt assets)
        shell: bash
        run: |
          rm -rf .dart_tool/hooks_runner
          dart test
          grep "^osqp:" .dart_tool/hooks_runner/osqp/*/stdout.txt

  publish:
    needs: [analyze, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pull all prebuilt assets into prebuilt/ directory
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: prebuilt/

      - name: Display bundled assets
        run: ls -la prebuilt/

      - name: Install dependencies and run tests using bundled prebuilt assets
        run: |
          dart pub get
          dart test
          grep "^osqp:" .dart_tool/hooks_runner/osqp/*/stdout.txt

      - name: Verify package with dart pub publish --dry-run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: startsWith(github.ref, 'refs/tags/v')
        run: dart pub publish --force

name: osqp
description: Dart bindings for the OSQP quadratic programming solver.
version: 1.0.0
repository: https://github.com/liamappelbe/osqp
topics:
  - math
  - optimization
  - ffi
  - linear-programming
  - quadratic-programming

environment:
  sdk: ^3.13.2

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_cmake: ^0.3.2

dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.0.0
  test: ^1.25.6
